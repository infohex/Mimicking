<html lang="zh-CN">
<head>

<title>Mimicking 流程图</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* layout: tab strip, a vertical tree (top-to-bottom chain of stage cards, parallel branches side by side), detail panel on the right (stacks below on phones) */
:root {
  --bg: #f5f6f4; --panel: #ffffff; --fg: #1b2420; --muted: #5d6a64; --line: #d6dcd8; --accent: #0e6f6b; --accent-soft: #d9ecea; --hot: #c2552a;
  --lane-dsp: #e8efe7; --lane-onnx: #e5eaf3; --lane-pipe: #f3eadc; --lane-tool: #efe6ee; --lane-host: #ece9e1;
  --font-display: "Manrope", "Segoe UI", system-ui, sans-serif; --font-mono: "IBM Plex Mono", Consolas, "Courier New", monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#121715; --panel:#1a211e; --fg:#e6ebe8; --muted:#9aa8a1; --line:#2d3732; --accent:#5fc3bd; --accent-soft:#19403d; --hot:#e8865e;
  --lane-dsp:#1b2a21; --lane-onnx:#1b2130; --lane-pipe:#2b2518; --lane-tool:#2a1f2a; --lane-host:#24231d; color-scheme: dark; } }
:root[data-theme="dark"] { --bg:#121715; --panel:#1a211e; --fg:#e6ebe8; --muted:#9aa8a1; --line:#2d3732; --accent:#5fc3bd; --accent-soft:#19403d; --hot:#e8865e;
  --lane-dsp:#1b2a21; --lane-onnx:#1b2130; --lane-pipe:#2b2518; --lane-tool:#2a1f2a; --lane-host:#24231d; color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-display); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 40px; }
h1 { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.01em; margin: 0; }
.sub { color: var(--muted); margin: 4px 0 16px; max-width: 80ch; }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.tab { border: 1px solid var(--line); background: var(--panel); color: var(--fg); border-radius: 999px; padding: 6px 14px; font: inherit; font-weight: 600; cursor: pointer; }
.tab[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
.wrap { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; align-items: start; }
.wrap > * { min-width: 0; }
@media (max-width: 960px) { .wrap { grid-template-columns: 1fr; } }
.stage { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; min-width: 0; padding: 14px 12px 6px; }
.stage h2 { font-size: 1.05rem; margin: 0 6px 10px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 0 6px 12px; font: 400 12px var(--font-mono); color: var(--muted); }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -2px; margin-right: 4px; border: 1px solid var(--line); }
/* vertical tree */
.chain { display: flex; flex-direction: column; align-items: center; gap: 0; min-width: 0; }
.node { width: min(100%, 300px); background: var(--panel); border: 1.2px solid var(--line); border-radius: 9px; padding: 8px 12px; cursor: pointer; text-align: left; transition: border-color .15s; }
.node:hover, .node.active { border-color: var(--accent); border-width: 2px; padding: 7px 11px; }
.node.active { background: var(--accent-soft); }
.node.dsp { background: var(--lane-dsp); } .node.onnx { background: var(--lane-onnx); } .node.pipe { background: var(--lane-pipe); } .node.tool { background: var(--lane-tool); } .node.host { background: var(--lane-host); }
.node.active.dsp, .node.active.onnx, .node.active.pipe, .node.active.tool, .node.active.host { background: var(--accent-soft); }
.node .lb { font-weight: 700; font-size: 13.5px; }
.node .mt { font: 400 11.5px var(--font-mono); color: var(--muted); margin-top: 1px; overflow-wrap: anywhere; }
.node .ms { font: 500 11px var(--font-mono); color: var(--hot); margin-left: 6px; }
.node .cr { font: 500 10.5px var(--font-mono); color: var(--accent); margin-top: 2px; }
.arrow { width: 2px; height: 18px; background: var(--muted); opacity: .6; position: relative; }
.arrow::after { content: ""; position: absolute; left: -4px; bottom: -1px; border: 5px solid transparent; border-top: 7px solid var(--muted); opacity: .9; }
.arrow.lbl::before { content: attr(data-l); position: absolute; left: 10px; top: 0; font: 400 10.5px var(--font-mono); color: var(--muted); white-space: nowrap; }
.fork { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px 18px; width: 100%; padding: 6px 4px; border-top: 1px dashed var(--line); border-bottom: 1px dashed var(--line); margin: 2px 0; }
.branch { display: flex; flex-direction: column; align-items: center; flex: 1 1 240px; max-width: 320px; min-width: 200px; }
.branch .bl { font: 600 11px var(--font-display); color: var(--muted); letter-spacing: .06em; text-transform: uppercase; margin-bottom: 4px; }
.join { font: 400 11px var(--font-mono); color: var(--muted); margin: 2px 0; }
/* detail */
.detail { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; position: sticky; top: 8px; min-width: 0; }
.detail h3 { font-size: 1.05rem; margin: 0 0 2px; }
.detail .crate { display: inline-block; font: 500 11px var(--font-mono); color: var(--accent); background: var(--accent-soft); border-radius: 4px; padding: 1px 6px; margin-bottom: 8px; }
.detail dl { display: grid; grid-template-columns: 5.5em 1fr; gap: 4px 10px; margin: 8px 0; }
.detail dt { color: var(--muted); font-size: 12px; }
.detail dd { margin: 0; font-family: var(--font-mono); font-size: 12.5px; overflow-wrap: anywhere; }
.detail p { margin: 8px 0 0; font-size: 13.5px; }
.detail .hint { color: var(--muted); font-size: 13px; }
.detail dl.io { grid-template-columns: 3em 1fr; gap: 6px 10px; margin: 10px 0 12px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
.detail dl.io dt { font-weight: 600; color: var(--accent); }
.detail dl.io dd { font-family: inherit; font-size: 13.5px; line-height: 1.45; }
/* timing bar */
.bar { margin: 12px 6px 10px; }
.bar .track { display: flex; height: 22px; border-radius: 6px; overflow: hidden; border: 1px solid var(--line); }
.bar .seg { height: 100%; min-width: 2px; cursor: pointer; opacity: .85; }
.bar .seg:hover, .bar .seg.active { opacity: 1; outline: 2px solid var(--hot); outline-offset: -2px; }
.bar .lg { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 6px; font: 400 12px var(--font-mono); color: var(--muted); }
.bar .lg b { color: var(--fg); font-weight: 500; }
/* tables, milestones, glossary */
table.t { width: 100%; border-collapse: collapse; font-size: 13.5px; margin: 8px 0 14px; }
table.t th, table.t td { text-align: left; padding: 6px 8px; border-top: 1px solid var(--line); vertical-align: top; }
table.t th { color: var(--muted); font-weight: 600; font-size: 12px; }
table.t td.n { font-family: var(--font-mono); font-size: 12.5px; white-space: nowrap; }
.timeline { display: grid; gap: 10px; padding: 6px; }
.ms-card { border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; background: var(--panel); display: grid; grid-template-columns: 5.5em 1fr; gap: 4px 12px; }
.ms-card .tag { font: 800 14px var(--font-display); color: var(--accent); }
.ms-card .num { font: 500 12px var(--font-mono); color: var(--hot); }
.ms-card .num span { color: var(--muted); }
.ms-card ul { margin: 4px 0 0; padding-left: 18px; font-size: 13.5px; }
.note { font-size: 12.5px; color: var(--muted); padding: 6px 6px 8px; }
.gloss { padding: 6px; }
.gloss input { width: 100%; font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--fg); margin-bottom: 12px; }
.gloss h4 { font-size: 0.8rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 16px 0 6px; }
.gloss table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.gloss td { vertical-align: top; padding: 7px 8px; border-top: 1px solid var(--line); }
.gloss td:first-child { white-space: nowrap; font-weight: 800; width: 7em; }
.gloss td:nth-child(2) { font-family: var(--font-mono); font-size: 12.5px; color: var(--accent); width: 15em; overflow-wrap: anywhere; }
.gloss .where { color: var(--muted); font-size: 12.5px; }
@media (max-width: 700px) { .gloss td:first-child, .gloss td:nth-child(2) { width: auto; } .gloss tr { display: grid; grid-template-columns: 1fr; border-top: 1px solid var(--line); padding: 6px 0; } .gloss td { border-top: none; padding: 2px 8px; } }
kbd { font-family: var(--font-mono); font-size: 11px; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
[hidden] { display: none !important; }
</style>
</head>

<h1>Mimicking 流程图</h1>
<p class="sub">2.0 正式版（2026-11-01）。自上而下读：每张卡是一级处理，并排的分支是同时进行、随后汇合的路径。点卡片看输入、输出、作用、去向、形状、耗时和所在文件。耗时为 RTX A4000、CUDA Graph、单路、块 240 ms、10 步、CFG 0.7 下的 Lab 实测。</p>

      io: { i: "声卡回调送来的设备采样率音频（Lab：WASAPI 共享模式，48 kHz）。", o: "16 kHz 单声道块，3840 样本 = 240 ms（160 ms 套 2560）。", r: "整条链路的节拍单位：攒满一块才能算，所以块长本身是延时的第一项。", n: "Runner::push(&mut session, &block16)。采集溢出要丢不要攒；麦克风的自动增益 / 噪声抑制要关（AGC 在响的敲击后压低增益几秒）。" } },

function flat(chain, out) { for (const s of chain) { if (s.fork) { for (const b of s.fork) flat(b.chain, out); } else out.push(s); } return out; }
function nodeEl(n) {
  const b = document.createElement("button"); b.type = "button"; b.className = "node " + n.lane; b.dataset.id = n.id;
  b.innerHTML = `<div class="lb">${esc(n.label)}${n.ms != null ? `<span class="ms">${n.ms} ms</span>` : ""}</div><div class="mt">${esc(n.meta || "")}</div><div class="cr">${esc((n.crate || "").split("（")[0])}</div>`;
  b.onclick = () => select(n.id);
  return b;
}
function arrowEl(label) { const a = document.createElement("div"); a.className = "arrow" + (label ? " lbl" : ""); if (label) a.dataset.l = label; return a; }
function renderChain(chain, container) {
  chain.forEach((s, i) => {
    if (i > 0) container.appendChild(arrowEl(s.fork ? "分叉" : ""));
    if (s.fork) {
      const f = document.createElement("div"); f.className = "fork";
      for (const b of s.fork) { const col = document.createElement("div"); col.className = "branch"; const l = document.createElement("div"); l.className = "bl"; l.textContent = b.label; col.appendChild(l); renderChain(b.chain, col); f.appendChild(col); }
      container.appendChild(f);
      if (s.join) { const j = document.createElement("div"); j.className = "join"; j.textContent = "⤓ " + s.join; container.appendChild(j); }
    } else container.appendChild(nodeEl(s));
  });
}
function esc(s) { return String(s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }
function show(view) {
  current = view; active = null;
  for (const t of document.querySelectorAll(".tab")) t.setAttribute("aria-selected", t.dataset.v === view);
  tree.innerHTML = ""; extra.innerHTML = ""; bar.hidden = true; tl.hidden = true; gloss.hidden = true; legend.innerHTML = ""; note.textContent = "";
  if (view === "milestones") { title.textContent = "里程碑与数字"; tl.hidden = false; tl.innerHTML = milestones.map(m => `<div class="ms-card"><div><div class="tag">${esc(m.tag)}</div><div class="num">${esc(m.num)}<br><span>${esc(m.sub)}</span></div></div><ul>${m.items.map(i => `<li>${esc(i)}</li>`).join("")}</ul></div>`).join(""); extra.innerHTML = latency; detail.innerHTML = `<p class="hint">左侧是从调研到正式版的节点与关键数字；下方两张表是延时预算与质量。细节见 docs/release-2.0.md。</p>`; return; }
  if (view === "glossary") { title.textContent = "术语表"; gloss.hidden = false; drawGlossary(document.getElementById("gloss-q").value); detail.innerHTML = `<p class="hint">缩写、全称、解释与出现位置。第一组是 2.0 正式版新增的概念。</p>`; return; }
  const v = VIEWS[view]; title.textContent = v.title; note.textContent = v.note || "";
  legend.innerHTML = v.lanes.map(l => `<span><i class="node ${l}" style="padding:0;width:12px;height:12px;display:inline-block"></i>${esc(LANE_NAMES[l])}</span>`).join("");
  const c = document.createElement("div"); c.className = "chain"; renderChain(v.chain, c); tree.appendChild(c);
  order = flat(v.chain, []);
  const timed = order.filter(n => n.ms != null);
  if (view === "runtime" && timed.length) {
    bar.hidden = false; const total = timed.reduce((a, n) => a + n.ms, 0);
    const colors = { onnx: "#6b86c9", dsp: "#5fa06f", pipe: "#c99a4f", host: "#999" };
    bar.innerHTML = `<div class="track">${timed.map(n => `<div class="seg" data-id="${n.id}" style="width:${(100 * n.ms / total).toFixed(2)}%;background:${colors[n.lane]}" title="${esc(n.label)} ${n.ms} ms"></div>`).join("")}</div><div class="lg">${timed.map(n => `<span><b>${esc(n.label)}</b> ${n.ms}</span>`).join("")}<span><b>合计</b> ≈ ${total.toFixed(1)} ms / 块（周期 240 ms；Lab 实测 total 32 ms，含门 1 ms 与主机拷贝）</span></div>`;
    bar.querySelectorAll(".seg").forEach(s => s.onclick = () => select(s.dataset.id));

function select(id) {
  const n = order.find(x => x.id === id); if (!n) return; active = id; location.hash = id;
  document.querySelectorAll(".node").forEach(e => e.classList.toggle("active", e.dataset.id === id));
  document.querySelectorAll(".seg").forEach(e => e.classList.toggle("active", e.dataset.id === id));

  const el = document.querySelector(`.node[data-id="${id}"]`); if (el) el.scrollIntoView({ block: "nearest", behavior: "smooth" });
}
document.addEventListener("keydown", e => { if (!active || !order.length) return; const i = order.findIndex(n => n.id === active); if (e.key === "ArrowDown" && i < order.length - 1) select(order[i + 1].id); if (e.key === "ArrowUp" && i > 0) select(order[i - 1].id); });
function drawGlossary(q) {
  const list = document.getElementById("gloss-list"); const needle = (q || "").trim().toLowerCase(); list.innerHTML = ""; let shown = 0;
  for (const g of glossary) {
    const rows = g.items.filter(r => !needle || r.join(" ").toLowerCase().includes(needle)); if (!rows.length) continue; shown += rows.length;
    const h = document.createElement("h4"); h.textContent = g.group; list.appendChild(h);
    const t = document.createElement("table"); t.innerHTML = rows.map(([a, f, e, w]) => `<tr><td>${esc(a)}</td><td>${esc(f)}</td><td>${esc(e)}<div class="where">见：${esc(w)}</div></td></tr>`).join(""); list.appendChild(t);
  }
  if (!shown) list.innerHTML = `<div class="note">没有匹配的术语。</div>`;
}
document.getElementById("gloss-q").addEventListener("input", e => drawGlossary(e.target.value));
const tabs = document.getElementById("tabs");
for (const [v, name] of TAB_ORDER) { const b = document.createElement("button"); b.className = "tab"; b.role = "tab"; b.dataset.v = v; b.textContent = name; b.onclick = () => show(v); tabs.appendChild(b); }
show("runtime");
</script>
</body>
</html>
